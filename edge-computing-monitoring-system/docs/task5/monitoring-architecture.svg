<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi cluster monitoring architecture</title>
  <desc id="desc">Pi5, Pi4 and eight Pi3 nodes expose Node Exporter metrics to Prometheus in K3s. Prometheus supplies Grafana, Alertmanager and the FastAPI backend, which supplies the React frontend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324d" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#356b9a"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#163a5c}
      .subtitle{font:400 16px Arial,sans-serif;fill:#5f7487}
      .box-title{font:700 18px Arial,sans-serif;fill:#173f62}
      .box-text{font:400 14px Arial,sans-serif;fill:#40586d}
      .small{font:600 13px Arial,sans-serif;fill:#35627f}
      .box{stroke:#8db3d1;stroke-width:1.5;filter:url(#shadow)}
      .flow{stroke:#356b9a;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .flow-dash{stroke:#6f94b4;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" class="title">Raspberry Pi Cluster Monitoring Architecture</text>
  <text x="600" y="76" text-anchor="middle" class="subtitle">Host metrics → K3s monitoring stack → application dashboard</text>

  <!-- Raspberry Pi devices -->
  <rect x="55" y="125" width="250" height="130" rx="16" fill="#ffffff" class="box"/>
  <text x="180" y="157" text-anchor="middle" class="box-title">Raspberry Pi Devices</text>
  <text x="180" y="187" text-anchor="middle" class="box-text">Pi5 control plane</text>
  <text x="180" y="210" text-anchor="middle" class="box-text">Pi4 sensor node</text>
  <text x="180" y="233" text-anchor="middle" class="box-text">8 × Pi3 workers</text>

  <rect x="55" y="300" width="250" height="108" rx="16" fill="#e9f6ee" class="box"/>
  <text x="180" y="334" text-anchor="middle" class="box-title">Node Exporter</text>
  <text x="180" y="362" text-anchor="middle" class="box-text">Linux systemd service</text>
  <text x="180" y="385" text-anchor="middle" class="small">HTTP metrics • port 9100</text>

  <path d="M180 255 L180 294" class="flow"/>

  <!-- K3s cluster boundary -->
  <rect x="380" y="105" width="765" height="420" rx="22" fill="#ffffff" stroke="#6b9bc1" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="410" y="137" class="box-title">K3s cluster</text>
  <text x="410" y="160" class="small">namespace: monitoring</text>

  <rect x="430" y="195" width="280" height="145" rx="18" fill="#fff2e4" class="box"/>
  <text x="570" y="229" text-anchor="middle" class="box-title">Prometheus</text>
  <text x="570" y="258" text-anchor="middle" class="box-text">Scrapes and stores metrics</text>
  <text x="570" y="281" text-anchor="middle" class="small">Internal service :9090</text>
  <text x="570" y="305" text-anchor="middle" class="small">External NodePort :30090</text>

  <rect x="790" y="180" width="285" height="82" rx="16" fill="#f2eefe" class="box"/>
  <text x="932" y="214" text-anchor="middle" class="box-title">Grafana</text>
  <text x="932" y="238" text-anchor="middle" class="box-text">Dashboards and trends</text>

  <rect x="790" y="284" width="285" height="82" rx="16" fill="#fff0f0" class="box"/>
  <text x="932" y="318" text-anchor="middle" class="box-title">Alertmanager</text>
  <text x="932" y="342" text-anchor="middle" class="box-text">Alert routing and state</text>

  <rect x="790" y="388" width="285" height="82" rx="16" fill="#eef7ff" class="box"/>
  <text x="932" y="420" text-anchor="middle" class="box-title">Operator + kube-state-metrics</text>
  <text x="932" y="446" text-anchor="middle" class="box-text">Kubernetes monitoring resources</text>

  <path d="M305 354 C355 354 370 270 424 270" class="flow"/>
  <text x="355" y="320" text-anchor="middle" class="small">scrape :9100</text>
  <path d="M710 235 L784 221" class="flow"/>
  <path d="M710 276 L784 324" class="flow"/>
  <path d="M710 315 C744 360 752 421 784 429" class="flow-dash"/>

  <!-- Backend and frontend -->
  <rect x="430" y="575" width="280" height="108" rx="18" fill="#e8f5ff" class="box"/>
  <text x="570" y="608" text-anchor="middle" class="box-title">FastAPI Backend</text>
  <text x="570" y="636" text-anchor="middle" class="box-text">/api/v1/monitoring/overview</text>
  <text x="570" y="660" text-anchor="middle" class="small">namespace: edge-monitoring</text>

  <rect x="800" y="575" width="275" height="108" rx="18" fill="#eaf8f1" class="box"/>
  <text x="938" y="608" text-anchor="middle" class="box-title">React Frontend</text>
  <text x="938" y="636" text-anchor="middle" class="box-text">Monitoring and Alerts pages</text>
  <text x="938" y="660" text-anchor="middle" class="small">Refresh interval: 5 seconds</text>

  <path d="M570 340 L570 569" class="flow"/>
  <text x="586" y="465" class="small">PromQL via service DNS</text>
  <path d="M710 629 L794 629" class="flow"/>
  <text x="752" y="613" text-anchor="middle" class="small">JSON API</text>

  <text x="600" y="730" text-anchor="middle" class="subtitle">Metrics remain inside the local edge cluster; the UI consumes normalized monitoring data from FastAPI.</text>
</svg>
