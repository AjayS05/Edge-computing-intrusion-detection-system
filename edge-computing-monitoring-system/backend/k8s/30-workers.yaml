apiVersion: v1
kind: Service
metadata:
  name: image-worker-headless
  namespace: edge-monitoring
spec:
  clusterIP: None
  selector:
    app: edge-image-worker
  ports:
    - name: http
      port: 8002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-worker
  namespace: edge-monitoring
  labels:
    app: edge-image-worker
spec:
  replicas: 8
  selector:
    matchLabels:
      app: edge-image-worker
  template:
    metadata:
      labels:
        app: edge-image-worker
    spec:
      nodeSelector:
        edge-role: image-worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: edge-image-worker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: edge-image-worker
      terminationGracePeriodSeconds: 15
      containers:
        - name: worker
          image: edge-worker:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_PROCESSING_MODE
              value: "clahe"
            - name: MAX_UPLOAD_SIZE_BYTES
              value: "5242880"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
