apiVersion: v1
kind: Namespace
metadata:
  name: edge-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: edge-monitoring
data:
  APP_NAME: "Edge Monitoring Backend"
  APP_VERSION: "0.2.0"
  STORAGE_BACKEND: "s3"
  DATA_DIRECTORY: "/data"
  RUN_INFERENCE_ON_UPLOAD: "true"
  YOLO_MODEL_PATH: "/app/models/best_k.pt"
  YOLO_CONFIDENCE_THRESHOLD: "0.55"
  MAX_UPLOAD_SIZE_BYTES: "5242880"
  S3_ENDPOINT_URL: "http://seaweedfs-s3.seaweedfs:8333"
  S3_IMAGES_BUCKET: "captured-images"
  S3_METADATA_BUCKET: "event-metadata"
  S3_UNSIGNED_REQUESTS: "true"
  TELEGRAM_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: edge-monitoring
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "replace_with_your_bot_token"
  TELEGRAM_CHAT_ID: "replace_with_your_chat_id"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: edge-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-backend
  template:
    metadata:
      labels:
        app: edge-backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: cloud
      containers:
        - name: backend
          image: edge-monitoring-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: backend-data
              mountPath: /data
      volumes:
        - name: backend-data
          hostPath:
            path: /srv/nfs/edge-monitoring/backend-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: edge-monitoring
spec:
  type: NodePort
  selector:
    app: edge-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
