apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-kubernetes-reader
  namespace: edge-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-kubernetes-reader
  namespace: edge-monitoring
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-kubernetes-reader
  namespace: edge-monitoring
subjects:
  - kind: ServiceAccount
    name: backend-kubernetes-reader
    namespace: edge-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-kubernetes-reader
