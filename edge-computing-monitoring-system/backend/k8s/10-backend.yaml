apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: edge-monitoring
  labels:
    app: edge-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: edge-backend
  template:
    metadata:
      labels:
        app: edge-backend
    spec:
      serviceAccountName: backend-kubernetes-reader
      nodeSelector:
        kubernetes.io/hostname: cloud
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: edge-backend:20260715202058
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          volumeMounts:
            - name: backend-data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
      volumes:
        - name: backend-data
          hostPath:
            path: /srv/nfs/edge-monitoring/backend-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: edge-monitoring
spec:
  type: NodePort
  selector:
    app: edge-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
