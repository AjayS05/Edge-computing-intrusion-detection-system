site_name: PiWatch
site_description: Distributed Edge AI Monitoring and Threat Detection Platform
site_url: https://yourdomain.com # Change to your actual domain

theme:
  name: material
  favicon: assets/favicon.png

  # Modern, sleek color palettes with proper contrast
  palette:
    - scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Premium navigation and UI UX features
  features:
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - content.code.copy

# Custom CSS override to give it a premium, modern software platform feel
extra_css:
  - stylesheets/extra.css

# High-quality typography configuration
theme_config:
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true # Clean UI tabs for code blocks/configs
  - admonition
  - attr_list
  - md_in_html

nav:
  - Home: index.md

  - Hardware & Infrastructure:
        # - Hardware Components: task1/hardware.md
        - System Architecture: task1/architecture.md
        - Execution Flow: task1/execution_flow.md
      # - Raspberry Pi Cluster: task1/cluster.md
      # - PXE Boot: task1/pxe.md
      # - Operating System Setup: task1/os.md

  - Performance Evaluation:
      - HPL & GFLOPS Benchmarks: task2/hpl.md
      - MPI Cluster Setup: task3/mpi.md
      - Non-MPI Performance: task4/non-mpi.md
      # - Amdahl's Law Analysis: task3/amdahl.md
      # - Gustafson's Law Analysis: task3/gustafson.md

  - Monitoring Platform:
      - Infrastructure Architecture: task5/monitoring.md
      - Prometheus Metrics: task5/prometheus.md
      - Grafana Dashboards: task5/grafana.md

  - AI Threat Detection:
      - Dataset Collection: task6/dataset.md
      - Model Training: task6/training.md
      - Model Architecture: task6/model.md
      - Detection Results: task6/results.md

  - Backend Services:
      - Service Overview: task7/backend_overview.md
      - Architecture Design: task7/backend_architecture.md
      - REST API Reference: task7/backend_api.md
      - SeaweedFS Storage: task7/seaweedfs.md
      - Kubernetes Deployment: task7/kubernetes.md

  - Frontend Dashboard:
      - UI Architecture: task8/frontend_architecture.md
      - User Interface Components: task8/ui.md
      - Real-time Event Dashboard: task8/dashboard.md

  - Alerts & Notifications:
      - Telegram Bot Architecture: task9/telegram.md

  - Results & Analysis:
      - Performance Summary: results/performance.md
      - Future Work: results/future_work.md
  - The Team: team.md